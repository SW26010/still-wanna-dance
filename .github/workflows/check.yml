name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/refresh.test.mjs scripts/navigation.test.mjs scripts/acceptance-protocol.test.mjs scripts/acceptance-request.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version ci-${{ github.run_number }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-portable.ps1 -Zip artifacts/StepStash-ci-${{ github.run_number }}-windows-amd64-portable.zip
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: StepStash-windows-amd64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
