name: check
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to publish from the selected ref (empty = checks only)'
        type: string
        default: ''
      validation_run_id:
        description: 'Reuse a successful full check run for delivery/docs-only changes (optional)'
        type: string
        default: ''
      previous_tag:
        description: 'Upgrade baseline (empty = most recently published version)'
        type: string
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  pull_request:
permissions:
  contents: read
concurrency:
  # Keep release attempts for one tag serialized; cancel superseded branch/PR checks.
  group: check-${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('{0}-{1}', github.event_name, github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
jobs:
  repository:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/repository-artifacts.yml

  validation:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check validation reuse and select upgrade baseline
        id: plan
        uses: actions/github-script@v9
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const {pathToFileURL} = require('node:url');
            const path = require('node:path');
            const {checkValidationReuse} = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/release-validation.mjs')).href);
            core.setOutput('reuse', 'false');
            const id = process.env.VALIDATION_RUN_ID;
            if (id) {
              if (!/^[1-9][0-9]*$/.test(id) || !Number.isSafeInteger(Number(id))) throw Error('Invalid validation_run_id');
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
              const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: 'check.yml'});
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: Number(id), filter: 'all', per_page: 100});
              const input = {run, jobs, files: [], repository: `${context.repo.owner}/${context.repo.repo}`, workflowID: workflow.id, currentRunID: context.runId};
              checkValidationReuse(input);
              const files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', run.head_sha, 'HEAD', '--'], {encoding: 'utf8'}).split('\0').filter(Boolean);
              checkValidationReuse({...input, files});
              core.setOutput('reuse', 'true');
              await core.summary.addHeading('Reused full product validation').addLink(`Run ${run.id} (${run.head_sha})`, run.html_url).addRaw(`\n\nDelivery/docs-only changes: ${files.length}\n`).write();
            }
            let previous = process.env.PREVIOUS_TAG;
            if (process.env.RELEASE_TAG) {
              if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) throw Error('Invalid release_tag');
              if (!previous) {
                const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
                previous = releases.filter(r => !r.draft && r.tag_name !== process.env.RELEASE_TAG && /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(r.tag_name)).sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0]?.tag_name || '';
              }
              if (previous && (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(previous) || previous === process.env.RELEASE_TAG)) throw Error('Invalid previous_tag');
              await core.summary.addRaw(`\nUpgrade baseline: ${previous || 'none (first publication; no cross-version claim)'}\n`).write();
            }
            core.setOutput('previous_tag', previous);

  tools:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Check release tools
        run: ./scripts/release-preflight.ps1 -Scope tools
      - name: Retain tool diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tool-failure-windows
          path: artifacts/release-preflight
          if-no-files-found: ignore

  test:
    needs: [validation, tools, repository]
    if: >-
      always() && !cancelled() && needs.validation.result == 'success' && needs.tools.result == 'success' &&
      (needs.repository.result == 'success' || needs.repository.result == 'skipped') && needs.validation.outputs.reuse != 'true'
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - name: Representative product checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        run: ./scripts/release-preflight.ps1 -Scope product -Representative
      - name: Full product checks
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: ./scripts/release-preflight.ps1 -Scope product
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-failure-windows
          path: |
            artifacts/webui-tests
            artifacts/release-preflight
          if-no-files-found: ignore

  race:
    needs: [validation, tools, repository]
    if: >-
      always() && !cancelled() && needs.validation.result == 'success' && needs.tools.result == 'success' &&
      (needs.repository.result == 'success' || needs.repository.result == 'skipped') && needs.validation.outputs.reuse != 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[0,1,2,3,4,5]' || '[0]') }}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Install pinned Windows GCC
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'w64devkit-x64-2.10.0.7z.exe'
          Invoke-WebRequest -Uri 'https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne '18D0A4C71A166F8401AB6305781BEC5882B40B5E06BA9807C61CB5F3B3C6325E') { throw 'Windows GCC archive hash mismatch.' }
          & 7z x $archive "-o$env:RUNNER_TEMP" -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract Windows GCC.' }
          $compiler = Join-Path $env:RUNNER_TEMP 'w64devkit/bin/gcc.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Windows GCC is missing.' }
          "CC=$compiler" >> $env:GITHUB_ENV
      - name: Full Windows race shard
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: ./scripts/release-preflight.ps1 -Scope race -RaceShard ${{ matrix.shard }}
      - name: Representative race checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        run: ./scripts/release-preflight.ps1 -Scope race -Representative
      - name: Retain race diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: race-failure-${{ matrix.shard }}
          path: artifacts/release-preflight
          if-no-files-found: ignore

  package:
    needs: [validation, tools, repository, test, race]
    if: >-
      always() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') &&
      needs.validation.result == 'success' && needs.tools.result == 'success' && needs.repository.result == 'success' &&
      (needs.validation.outputs.reuse == 'true' || (needs.test.result == 'success' && needs.race.result == 'success'))
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: '0'
      PREVIOUS_TAG: ${{ needs.validation.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare version tag for packaging
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
            if ($tagCommit -cne (git rev-parse HEAD)) { throw 'Release tag points to a different commit' }
          } else {
            git tag $env:RELEASE_TAG HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare release tag' }
          }
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - name: Build and verify the final delivery once
        shell: pwsh
        run: |
          $preflightArgs = @{ Scope = 'delivery'; ReleaseTag = $env:RELEASE_TAG }
          if ($env:PREVIOUS_TAG) {
            $preflightArgs.PreviousTag = $env:PREVIOUS_TAG
          }
          ./scripts/release-preflight.ps1 @preflightArgs
      - name: Include version release notes
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) {
            "`n" + (Get-Content -LiteralPath $notes -Raw) | Add-Content -LiteralPath "artifacts/still-wanna-dance-$env:RELEASE_TAG-release-notes.md" -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        with:
          name: still-wanna-dance-windows-amd64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-corresponding-source.tar.gz
            artifacts/*-release.json
            artifacts/*-release-notes.md
          if-no-files-found: error
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-validation-logs
          path: |
            artifacts/portable-smoke/**/*.log
            artifacts/portable-upgrade/**/*.log
            artifacts/release-preflight
          if-no-files-found: ignore

  release:
    needs: [package]
    if: always() && !cancelled() && needs.package.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v8
        with:
          name: still-wanna-dance-windows-amd64-portable
          path: artifacts
      - name: Check release identity and existing destination
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const fs = require('node:fs');
            const { checkReleaseManifest, releaseNames } = await import(pathToFileURL(path.resolve('scripts/release.mjs')));
            const { sha256 } = await import(pathToFileURL(path.resolve('scripts/release-source.mjs')));
            const tag = process.env.RELEASE_TAG;
            const names = releaseNames(tag);
            const manifest = checkReleaseManifest(JSON.parse(fs.readFileSync(path.join('artifacts', names.manifest), 'utf8')));
            if (manifest.tag !== tag || manifest.revision !== context.sha || manifest.repository !== `${context.repo.owner}/${context.repo.repo}`) throw Error('Release does not match this workflow commit');
            for (const asset of manifest.assets) {
              const file = path.join('artifacts', asset.name);
              if (fs.statSync(file).size !== asset.bytes || sha256(file) !== asset.sha256) throw Error(`Corrupt artifact: ${asset.name}`);
              if (fs.readFileSync(file + '.sha256', 'utf8').trim() !== `${asset.sha256}  ${asset.name}`) throw Error(`Wrong checksum file: ${asset.name}`);
            }
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              const { data } = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${tag}` });
              if (data.sha !== manifest.revision) throw Error('Existing tag points to another commit');
            } catch (error) { if (error.status !== 404) throw error; }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === tag && !release.draft)) throw Error('Refusing to overwrite a published release');
      - name: Upload complete delivery to draft
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          body_path: artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-release-notes.md
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-windows-amd64-portable.zip
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-windows-amd64-portable.zip.sha256
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-corresponding-source.tar.gz
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-corresponding-source.tar.gz.sha256
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-release.json
      - name: Publish and verify public delivery
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            const path = require('node:path');
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { sha256 } = await import(pathToFileURL(path.resolve('scripts/release-source.mjs')));
            const { releaseNames } = await import(pathToFileURL(path.resolve('scripts/release.mjs')));
            const names = releaseNames(process.env.RELEASE_TAG);
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            const expected = [names.portable, names.portable + '.sha256', names.source, names.source + '.sha256', names.manifest];
            if (!release.draft || release.tag_name !== process.env.RELEASE_TAG || release.assets.length !== expected.length) throw Error('Unexpected draft delivery');
            for (const name of expected) {
              const asset = release.assets.find(asset => asset.name === name);
              const file = path.join('artifacts', name);
              if (!asset || asset.state !== 'uploaded' || asset.size !== fs.statSync(file).size || asset.digest !== `sha256:${sha256(file)}`) throw Error(`Uploaded asset mismatch: ${name}`);
            }
            let publishedRelease;
            try {
              ({ data: publishedRelease } = await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, prerelease: process.env.RELEASE_TAG.includes('-'), make_latest: 'false' }));
              // The package job already rebuilt these exact bytes independently.
              await exec.exec('pwsh', ['-NoProfile', '-File', 'scripts/with-test-temp.ps1', 'node', 'scripts/release.mjs', 'verify-published-assets', '--manifest', path.join('artifacts', names.manifest)]);
            } catch (error) {
              // Stop exposing an unverified delivery. Never report it as successful.
              try {
                await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: true });
              } catch (rollbackError) {
                core.error(`Could not restore draft; check the release visibility: ${rollbackError.message}`);
              }
              throw error;
            }
            await core.summary.addHeading('Release verified').addLink(process.env.RELEASE_TAG, publishedRelease.html_url).write();
