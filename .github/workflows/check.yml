name: check
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
jobs:
  test:
    env:
      # Validate the setup-go version; never silently download a newer toolchain.
      GOTOOLCHAIN: local
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: node --test scripts/*.test.mjs
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-portable.ps1 -ReleaseTag $env:RELEASE_TAG
      - if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version ci-${{ github.run_number }}
      - if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/test-portable.ps1 -Zip artifacts/still-wanna-dance-ci-${{ github.run_number }}-windows-amd64-portable.zip
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: still-wanna-dance-windows-amd64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-corresponding-source.tar.gz
            artifacts/*-release.json
            artifacts/*-release-notes.md
          if-no-files-found: error
