name: check
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to publish from the selected ref (empty = checks only)'
        type: string
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  pull_request:
permissions:
  contents: read
concurrency:
  # Keep release attempts for one tag serialized; cancel superseded branch/PR checks.
  group: check-${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('{0}-{1}', github.event_name, github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
jobs:
  test:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - run: pnpm --dir webui install --frozen-lockfile
      - run: pnpm --dir webui check
      - name: Representative browser checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        run: ./scripts/with-test-temp.ps1 pnpm --dir webui exec playwright test e2e/terms-consent.spec.ts e2e/regressions.spec.ts
      - name: Full browser checks
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: ./scripts/with-test-temp.ps1 pnpm --dir webui test
      - name: Real Console settings integration
        shell: pwsh
        run: |
          $env:SWD_SETTINGS_BROWSER_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/settings-browser'
          ./scripts/with-test-temp.ps1 node scripts/go-patches.mjs test -tags=no_easytier ./internal/console -run '^TestSettingsSeparateBrowsers$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-failure-windows
          path: |
            artifacts/webui-tests
            artifacts/settings-browser
          if-no-files-found: ignore
      - run: ./scripts/with-test-temp.ps1 node --test scripts/*.test.mjs
      - run: ./scripts/with-test-temp.ps1 node scripts/go-patches.mjs test -tags=no_easytier ./...
      - run: ./scripts/with-test-temp.ps1 node scripts/go-patches.mjs vet -tags=no_easytier ./...
      - name: Check Go formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($LASTEXITCODE -ne 0 -or $unformatted.Count -ne 0) { $unformatted; throw 'Go files require formatting.' }

  race:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[0,1,2]' || '[0]') }}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Install pinned Windows GCC
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'w64devkit-x64-2.10.0.7z.exe'
          Invoke-WebRequest -Uri 'https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne '18D0A4C71A166F8401AB6305781BEC5882B40B5E06BA9807C61CB5F3B3C6325E') { throw 'Windows GCC archive hash mismatch.' }
          & 7z x $archive "-o$env:RUNNER_TEMP" -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract Windows GCC.' }
          $compiler = Join-Path $env:RUNNER_TEMP 'w64devkit/bin/gcc.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Windows GCC is missing.' }
          "CC=$compiler" >> $env:GITHUB_ENV
      - name: Race-check cache and Console shard
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: ./scripts/test-race-shard.ps1 -Shard ${{ matrix.shard }} -Shards 3
      - name: Race-check remaining packages
        if: matrix.shard == 0 && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $packages = @(node scripts/go-patches.mjs list -tags=no_easytier ./... | Where-Object { $_ -notin @('still-wanna-dance/internal/cacheproxy', 'still-wanna-dance/internal/console') })
          if ($LASTEXITCODE -ne 0 -or $packages.Count -eq 0) { throw 'Could not enumerate remaining Go packages.' }
          ./scripts/with-test-temp.ps1 node scripts/go-patches.mjs test -tags=no_easytier -race @packages -count=1 -timeout=45m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Representative race checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        shell: pwsh
        run: |
          $tests = '^(TestAnyTLSStreamConcurrentClose|TestVRChatExitWaitsWithoutPolling|TestVRChatExitWaitsForOtherInstancesAndRestart|TestVRChatExitObservationErrorsRecover|TestHTTPSeekDuringRangeInitialization|TestBlockDemandFollowsActualWaitAndIndependentReaders|TestNetworkConnectivityFullRunsThreeRequestsTogether|TestMixedDemandKeepsDeadlineAndOpportunisticAdmission)$'
          ./scripts/with-test-temp.ps1 node scripts/go-patches.mjs test -tags=no_easytier -race ./internal/blocksched ./internal/cacheproxy ./internal/console ./internal/desktop ./internal/proxyengine/mihomo "-run=$tests" -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare version tag for packaging
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
            if ($tagCommit -cne (git rev-parse HEAD)) { throw 'Release tag points to a different commit' }
          } else {
            git tag $env:RELEASE_TAG HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare release tag' }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - name: Build all Windows Go packages
        run: node scripts/go-patches.mjs build -tags=no_easytier ./...
        env:
          CGO_ENABLED: '0'
      - name: Build upgrade candidate
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version ci-${{ github.run_number }} -OutputDir artifacts/upgrade-baseline -AllPackages
      - name: Build and verify release with candidate overlay upgrade
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: ./scripts/package-portable.ps1 -ReleaseTag $env:RELEASE_TAG -PreviousZip artifacts/upgrade-baseline/still-wanna-dance-ci-${{ github.run_number }}-windows-amd64-portable.zip
      - if: env.RELEASE_TAG == ''
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version ci-${{ github.run_number }} -AllPackages
      - if: env.RELEASE_TAG == ''
        shell: pwsh
        run: ./scripts/test-portable.ps1 -Zip artifacts/still-wanna-dance-ci-${{ github.run_number }}-windows-amd64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: still-wanna-dance-windows-amd64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-corresponding-source.tar.gz
            artifacts/*-release.json
            artifacts/*-release-notes.md
          if-no-files-found: error
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-validation-logs
          path: |
            artifacts/portable-smoke/**/*.log
            artifacts/portable-upgrade/**/*.log
          if-no-files-found: ignore

  release:
    needs: [test, race, package]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: still-wanna-dance-windows-amd64-portable
          path: artifacts
      - name: Check release identity and existing destination
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const fs = require('node:fs');
            const { checkReleaseManifest, releaseNames } = await import(pathToFileURL(path.resolve('scripts/release.mjs')));
            const { sha256 } = await import(pathToFileURL(path.resolve('scripts/release-source.mjs')));
            const tag = process.env.RELEASE_TAG;
            const names = releaseNames(tag);
            const manifest = checkReleaseManifest(JSON.parse(fs.readFileSync(path.join('artifacts', names.manifest), 'utf8')));
            if (manifest.tag !== tag || manifest.revision !== context.sha || manifest.repository !== `${context.repo.owner}/${context.repo.repo}`) throw Error('Release does not match this workflow commit');
            for (const asset of manifest.assets) {
              const file = path.join('artifacts', asset.name);
              if (fs.statSync(file).size !== asset.bytes || sha256(file) !== asset.sha256) throw Error(`Corrupt artifact: ${asset.name}`);
              if (fs.readFileSync(file + '.sha256', 'utf8').trim() !== `${asset.sha256}  ${asset.name}`) throw Error(`Wrong checksum file: ${asset.name}`);
            }
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              const { data } = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${tag}` });
              if (data.sha !== manifest.revision) throw Error('Existing tag points to another commit');
            } catch (error) { if (error.status !== 404) throw error; }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === tag && !release.draft)) throw Error('Refusing to overwrite a published release');
      - name: Upload complete delivery to draft
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          body_path: artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-release-notes.md
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-windows-amd64-portable.zip
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-windows-amd64-portable.zip.sha256
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-corresponding-source.tar.gz
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-corresponding-source.tar.gz.sha256
            artifacts/still-wanna-dance-${{ env.RELEASE_TAG }}-release.json
      - name: Publish and verify public delivery
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            const path = require('node:path');
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { sha256 } = await import(pathToFileURL(path.resolve('scripts/release-source.mjs')));
            const { releaseNames } = await import(pathToFileURL(path.resolve('scripts/release.mjs')));
            const names = releaseNames(process.env.RELEASE_TAG);
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            const expected = [names.portable, names.portable + '.sha256', names.source, names.source + '.sha256', names.manifest];
            if (!release.draft || release.tag_name !== process.env.RELEASE_TAG || release.assets.length !== expected.length) throw Error('Unexpected draft delivery');
            for (const name of expected) {
              const asset = release.assets.find(asset => asset.name === name);
              const file = path.join('artifacts', name);
              if (!asset || asset.state !== 'uploaded' || asset.size !== fs.statSync(file).size || asset.digest !== `sha256:${sha256(file)}`) throw Error(`Uploaded asset mismatch: ${name}`);
            }
            let publishedRelease;
            try {
              ({ data: publishedRelease } = await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, prerelease: process.env.RELEASE_TAG.includes('-'), make_latest: 'false' }));
              // The package job already rebuilt these exact bytes independently.
              await exec.exec('pwsh', ['-NoProfile', '-File', 'scripts/with-test-temp.ps1', 'node', 'scripts/release.mjs', 'verify-published-assets', '--manifest', path.join('artifacts', names.manifest)]);
            } catch (error) {
              // Stop exposing an unverified delivery. Never report it as successful.
              try {
                await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: true });
              } catch (rollbackError) {
                core.error(`Could not restore draft; check the release visibility: ${rollbackError.message}`);
              }
              throw error;
            }
            await core.summary.addHeading('Release verified').addLink(process.env.RELEASE_TAG, publishedRelease.html_url).write();
