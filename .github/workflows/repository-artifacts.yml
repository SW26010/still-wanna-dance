name: repository-artifacts
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.5'
          enable-cache: false
      - run: ./scripts/release-preflight.ps1 -Scope repository
