name: check
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
jobs:
  test:
    env:
      # Validate the setup-go version; never silently download a newer toolchain.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - run: pnpm --dir webui install --frozen-lockfile
      - run: pnpm --dir webui check
      - run: pnpm --dir webui exec playwright install --with-deps chromium
      # Keep Windows fixtures out of the runner profile's 8.3 TEMP alias.
      - run: ${{ runner.os == 'Windows' && './scripts/with-test-temp.ps1' || '' }} pnpm --dir webui test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-failure-${{ runner.os }}
          path: artifacts/webui-tests
      - run: ${{ runner.os == 'Windows' && './scripts/with-test-temp.ps1' || '' }} node --test scripts/*.test.mjs
      - run: ${{ runner.os == 'Windows' && './scripts/with-test-temp.ps1' || '' }} go test -tags=no_easytier ./...
      - run: ${{ runner.os == 'Windows' && './scripts/with-test-temp.ps1' || '' }} go vet -tags=no_easytier ./...
      - run: go build -tags=no_easytier ./...
        env:
          CGO_ENABLED: '0'
      - if: runner.os == 'Linux'
        run: go test -tags=no_easytier -race ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-portable.ps1 -ReleaseTag $env:RELEASE_TAG
      - if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version ci-${{ github.run_number }}
      - if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/test-portable.ps1 -Zip artifacts/still-wanna-dance-ci-${{ github.run_number }}-windows-amd64-portable.zip
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: still-wanna-dance-windows-amd64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-corresponding-source.tar.gz
            artifacts/*-release.json
            artifacts/*-release-notes.md
          if-no-files-found: error
